<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright 4.0 - Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&family=Montserrat:wght@600;800&display=swap">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Rubik', sans-serif;
            background: #03000a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: #07021d;
            max-width: 30%;
        }
        .right-panel {
            flex: 2;
            background: url('assets/images/movies/movie-2-3840x2160.jpg') center/cover no-repeat;
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 100%;
        }
        .right-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
        }
        .right-panel h2 {
            position: relative;
            z-index: 1;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 800;
        }
        .right-panel p {
            position: relative;
            z-index: 1;
            color: white;
            font-size: 18px;
        }
        .social-icons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .social-icons a {
            color: white;
            font-size: 24px;
            text-decoration: none;
            transition: 0.3s;
        }
        .social-icons a:hover {
            color: #6a11cb;
        }
        .login-form {
            width: 80%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .login-form input {
            width: 90%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            background: #1a1a2e;
            color: white;
            border: 1px solid #444;
        }
        .login-form input::placeholder {
            color: #bbb;
        }
        .login-options {
            display: flex;
            justify-content: right;
            width: 90%;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .login-options a {
            color: #6a11cb;
            text-decoration: none;
        }
        .login-options a:hover {
            text-decoration: underline;
        }
        .login-form button {
            width: 90%;
            padding: 12px;
            border: none;
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-form button:hover {
            background: #2575fc;
        }
        .google-login {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80%;
            background: white;
            color: #333;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }
        .google-login:hover {
            background: #f1f1f1;
        }
        .register-section {
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h2>Entre na sua conta</h2>
            <form class="login-form">
                <input type="text" placeholder="E-mail" required>
                <input type="password" placeholder="Senha" required>
                <div class="login-options">
                    <a href="https://grupobright.com/minha-conta/senha-perdida/">Esqueci a senha</a>
                </div>
                <button type="submit">Login</button>
                <div class="google-login">Login com Google</div>
            </form>
            <p class="register-section">Novo na Bright? <a href="https://grupobright.com/minha-conta/">Crie sua conta</a></p>
            <div class="social-icons">
                <a href="https://discord.com/invite/CuCJ9XckC3" target="_blank"><i class="fab fa-discord"></i></a>
                <a href="https://www.instagram.com/grupobright/" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://chat.whatsapp.com/KCWBZV8nEXYIFfiMBzNoAa" target="_blank"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
        <div class="right-panel">
            <h2>Sua Plataforma de Cloud Gaming</h2>
            <p>Experimente a melhor tecnologia em jogos na nuvem, acessível em qualquer dispositivo.</p>
        </div>
    </div>
</body>
</html>
